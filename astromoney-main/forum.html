<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTROMONEY - Fórum da Comunidade</title>
    
    <!-- LIGAÇÃO AO FICHEIRO CSS GLOBAL -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* =========================================
           ESTILOS EXCLUSIVOS DESTA PÁGINA (FÓRUM)
           ========================================= */
        :root {
            --comment-bg: #141b2d; /* Adicionado aqui pois é exclusivo dos comentários */
        }
        
        body { 
            display: flex; flex-direction: column; min-height: 100vh; 
        }

        /* FÓRUM ESTRUTURA */
        .forum-container { max-width: 900px; margin: 3rem auto; padding: 0 2rem; flex-grow: 1; width: 100%; }
        .forum-header { text-align: center; margin-bottom: 3rem; }
        .forum-header h1 { font-size: 2.5rem; color: var(--text-main); margin-bottom: 0.5rem; }
        .forum-header p { color: var(--text-muted); font-size: 1.1rem; }

        .create-post-box { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 2rem; margin-bottom: 3rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .create-post-box h2 { margin-bottom: 1.5rem; color: var(--neon-blue); font-size: 1.2rem; }
        
        .input-group { margin-bottom: 1rem; }
        .input-group input, .input-group textarea { width: 100%; background-color: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); padding: 1rem; border-radius: 8px; outline: none; transition: border-color 0.3s; font-size: 1rem; }
        .input-group input:focus, .input-group textarea:focus { border-color: var(--primary-blue); box-shadow: 0 0 8px rgba(59, 130, 246, 0.3); }
        .input-group textarea { resize: vertical; min-height: 100px; }

        .btn-action { background-color: var(--primary-blue); color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 1rem; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3); }
        .btn-action:hover { background-color: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 15px rgba(59, 130, 246, 0.5); }

        .feed-container { display: flex; flex-direction: column; gap: 2rem; }
        .post-card { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 2rem; transition: transform 0.3s; }
        .post-card:hover { border-color: rgba(59, 130, 246, 0.5); }
        
        .post-header { display: flex; justify-content: space-between; margin-bottom: 1rem; align-items: center;}
        .post-author { color: var(--neon-blue); font-weight: bold; font-size: 0.9rem;}
        .post-date { color: var(--text-muted); font-size: 0.8rem; }
        .post-title { font-size: 1.5rem; color: var(--text-main); margin-bottom: 1rem; }
        .post-content { color: var(--text-muted); line-height: 1.8; margin-bottom: 1.5rem; }

        .comments-section { border-top: 1px solid var(--border-color); padding-top: 1.5rem; margin-top: 1.5rem; }
        .comment-list { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }
        .comment-item { background-color: var(--comment-bg); padding: 1rem; border-radius: 8px; border-left: 3px solid var(--primary-blue); font-size: 0.9rem; }
        .comment-author { font-weight: bold; color: #93c5fd; margin-bottom: 0.3rem; display: block; font-size: 0.8rem;}

        .add-comment-box { display: flex; gap: 1rem; }
        .add-comment-box input { flex-grow: 1; background-color: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.8rem; border-radius: 20px; outline: none; transition: 0.3s; }
        .add-comment-box input:focus { border-color: var(--primary-blue); }
        
        @media (max-width: 768px) { 
            .add-comment-box { flex-direction: column; } 
        }
    </style>
</head>
<body>
    <nav>
        <a href="grafico.html" class="logo">ASTRO<span>MONEY</span></a>
        <button class="menu-mobile-btn" onclick="alternarMenuMobile()">☰</button>
        <div class="nav-links">
            <a href="grafico.html">Gráfico</a>
            <a href="noticias.html">Notícias</a>
            <a href="forum.html" class="active">Fórum</a>
            <a href="perfil.html">Perfil</a>
            <a href="#" onclick="fazerLogout()" class="btn-login" style="background: #ef4444 !important; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4) !important;">Sair</a>
        </div>
    </nav>

    <main class="forum-container">
        <div class="forum-header">
            <h1>Comunidade ASTROMONEY</h1>
            <p>Partilhe as suas análises, tire dúvidas e converse com outros traders.</p>
        </div>

        <div class="create-post-box">
            <h2>Criar nova publicação</h2>
            <div class="input-group"><input type="text" id="post-title" placeholder="Título da sua publicação (Ex: Análise do Ouro hoje)"></div>
            <div class="input-group"><textarea id="post-content" placeholder="Escreva o conteúdo da sua análise ou dúvida aqui..."></textarea></div>
            <button class="btn-action" onclick="criarPost()">Publicar no Fórum</button>
        </div>

        <div class="feed-container" id="feed-de-posts"></div>
    </main>
<script src="app.js"></script>
    <script>
        let bancoDePosts = JSON.parse(localStorage.getItem('astroPosts')) || [];

        function renderizarPosts() {
            const feed = document.getElementById('feed-de-posts');
            feed.innerHTML = ''; 
            if (bancoDePosts.length === 0) {
                feed.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Ainda não há publicações. Seja o primeiro a postar!</p>';
                return;
            }

            const postsReversos = [...bancoDePosts].reverse();
            postsReversos.forEach(post => {
                let comentariosHTML = '';
                if (post.comentarios && post.comentarios.length > 0) {
                    post.comentarios.forEach(comentario => {
                        comentariosHTML += `<div class="comment-item"><span class="comment-author">Membro da Comunidade</span>${comentario}</div>`;
                    });
                }
                const cartaoPost = `
                    <div class="post-card">
                        <div class="post-header"><span class="post-author">Autor: Astro Trader</span><span class="post-date">${post.data}</span></div>
                        <h3 class="post-title">${post.titulo}</h3><p class="post-content">${post.conteudo}</p>
                        <div class="comments-section">
                            <div class="comment-list">${comentariosHTML}</div>
                            <div class="add-comment-box">
                                <input type="text" id="input-comentario-${post.id}" placeholder="Escreva uma resposta...">
                                <button class="btn-action" onclick="enviarComentario(${post.id})">Responder</button>
                            </div>
                        </div>
                    </div>`;
                feed.innerHTML += cartaoPost;
            });
        }

        function criarPost() {
            const campoTitulo = document.getElementById('post-title');
            const campoConteudo = document.getElementById('post-content');
            if (campoTitulo.value.trim() === '' || campoConteudo.value.trim() === '') { alert('Preencha os dados.'); return; }

            const novoPost = {
                id: Date.now(), titulo: campoTitulo.value, conteudo: campoConteudo.value,
                data: new Date().toLocaleDateString('pt-BR', { hour: '2-digit', minute: '2-digit' }), comentarios: []
            };

            bancoDePosts.push(novoPost);
            localStorage.setItem('astroPosts', JSON.stringify(bancoDePosts));
            campoTitulo.value = ''; campoConteudo.value = '';
            renderizarPosts();
        }

        function enviarComentario(idDoPost) {
            const campoComentario = document.getElementById(`input-comentario-${idDoPost}`);
            const textoComentario = campoComentario.value.trim();
            if (textoComentario === '') return; 

            const postEncontrado = bancoDePosts.find(post => post.id === idDoPost);
            if (postEncontrado) {
                postEncontrado.comentarios.push(textoComentario);
                localStorage.setItem('astroPosts', JSON.stringify(bancoDePosts));
                renderizarPosts();
            }
        }

        window.onload = function() { 
            protegerPagina(); // O segurança verifica a porta!
            desenharGrafico('TVC:GOLD'); 
        };
    </script>
</body>
</html>
