<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTROMONEY - Terminal Avançado</title>
    
    <!-- LIGAÇÃO AO FICHEIRO CSS GLOBAL -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Importação da biblioteca oficial do TradingView -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        /* =========================================
           ESTILOS EXCLUSIVOS DESTA PÁGINA (GRÁFICO)
           ========================================= */
        
        /* A página de gráfico precisa ser ecrã inteiro e sem scroll na página principal */
        body {
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* ÁREA DE TRABALHO E PAINÉIS LATERAIS */
        .workspace { display: flex; flex-grow: 1; overflow: hidden; position: relative; }
        .sidebar-left, .sidebar-right { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); overflow: hidden; }
        .sidebar-left.escondido, .sidebar-right.escondido { width: 0; padding-left: 0; padding-right: 0; border: none; opacity: 0; }

        /* Painel Esquerdo (Lista de Ativos) */
        .sidebar-left { width: 260px; background-color: var(--panel-bg); border-right: 1px solid var(--border-color); overflow-y: auto; padding: 1rem; flex-shrink: 0; }
        .sidebar-left::-webkit-scrollbar { width: 6px; }
        .sidebar-left::-webkit-scrollbar-thumb { background-color: var(--border-color); border-radius: 4px; }
        
        .categoria h3 { font-size: 0.85rem; color: var(--text-muted); margin: 1.5rem 0 0.8rem; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px;}
        
        .btn-ativo {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; background: rgba(0,0,0,0.2); color: var(--text-muted);
            border: 1px solid var(--border-color); padding: 0.8rem; margin-bottom: 0.5rem;
            border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 500;
            transition: all 0.3s ease; white-space: nowrap;
        }
        .btn-ativo:hover { 
            background-color: rgba(59, 130, 246, 0.1); border-color: rgba(59, 130, 246, 0.5);
            color: var(--text-main); transform: translateX(5px);
        }
        .btn-ativo.ativo-selecionado { 
            background: linear-gradient(90deg, rgba(59,130,246,0.3) 0%, rgba(59,130,246,0.1) 100%);
            border-left: 4px solid var(--primary-blue); border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color); border-right: 1px solid var(--border-color);
            color: white; font-weight: bold; transform: translateX(5px);
        }

        /* ÁREA CENTRAL: GRÁFICO E BARRA SUPERIOR */
        .chart-area { flex-grow: 1; display: flex; flex-direction: column; background-color: var(--bg-color); }
        
        .chart-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 15px; background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
        }
        
        .chart-header .right-controls { display: flex; gap: 8px; }

        .btn-acao {
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: var(--text-main);
            width: 36px; height: 36px; border-radius: 8px; cursor: pointer;
            font-size: 1.1rem; display: flex; align-items: center; justify-content: center; transition: 0.3s;
        }
        .btn-acao:hover { background: var(--primary-blue); border-color: var(--primary-blue); color: white; }

        .chart-container { flex-grow: 1; width: 100%; height: 100%; }

        /* PAINEL DIREITO: IA E NOTÍCIAS */
        .sidebar-right { width: 320px; background-color: var(--panel-bg); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; flex-shrink: 0; }
        
        .tab-selector { display: flex; border-bottom: 1px solid var(--border-color); }
        .tab-btn { flex: 1; padding: 1rem 0; background: none; border: none; color: var(--text-muted); cursor: pointer; font-weight: 600; transition: 0.3s; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #a78bfa; border-bottom-color: #a78bfa; }
        .tab-btn:nth-child(2).active { color: var(--primary-blue); border-bottom-color: var(--primary-blue); }
        
        .panel { display: none; flex-direction: column; flex-grow: 1; overflow: hidden; }
        .panel.active-panel { display: flex; }
        
        /* Estilos do Chat da IA */
        .ai-chat-history { flex-grow: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
        .balao { padding: 0.8rem; border-radius: 8px; font-size: 0.9rem; line-height: 1.4; max-width: 90%; }
        .balao-ia { background-color: var(--chat-ai); align-self: flex-start; border-bottom-left-radius: 0; }
        .balao-user { background-color: var(--chat-user); align-self: flex-end; border-bottom-right-radius: 0; color: white; }
        .ai-suggestions { padding: 0 1rem; display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
        .btn-sugestao { background-color: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-muted); padding: 0.6rem; border-radius: 6px; font-size: 0.8rem; cursor: pointer; transition: 0.3s; text-align: left; }
        .btn-sugestao:hover { border-color: var(--primary-blue); color: var(--text-main); }
        
        .ai-input-area { padding: 1rem; border-top: 1px solid var(--border-color); background-color: var(--panel-bg); display: flex; gap: 0.5rem; }
        .ai-input { flex-grow: 1; background-color: var(--bg-color); border: 1px solid var(--border-color); color: white; padding: 0.8rem; border-radius: 20px; outline: none; font-size: 0.9rem; transition: 0.3s;}
        .ai-input:focus { border-color: var(--primary-blue); }
        .btn-enviar { background-color: var(--primary-blue); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .btn-enviar:hover { background-color: var(--primary-hover); transform: scale(1.05); }
        
        /* Estilos das Notícias na barra lateral */
        .news-header { padding: 1rem; border-bottom: 1px solid var(--border-color); font-weight: bold; color: var(--primary-blue); font-size: 0.9rem; text-align: center; }
        .news-list { padding: 1rem; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 1rem; }
        .news-item { background: var(--bg-color); border-left: 3px solid var(--primary-blue); padding: 1rem; border-radius: 0 6px 6px 0; font-size: 0.85rem; line-height: 1.5; color: var(--text-muted); }
        .news-item strong { display: block; color: var(--text-main); margin-bottom: 5px; font-size: 0.9rem; }

        /* Responsividade para Telemóveis */
        @media (max-width: 900px) {
            .workspace { flex-direction: column; }
            .sidebar-left, .sidebar-right { width: 100%; height: auto; border-right: none; border-left: none; transition: none;}
            .sidebar-left { overflow-x: auto; display: flex; flex-direction: row; gap: 1rem;}
            .sidebar-left.escondido, .sidebar-right.escondido { display: none; }
            .sidebar-left .categoria { display: flex; align-items: center; gap: 0.5rem; margin: 0; border: none;}
            .sidebar-left h3 { margin: 0; border: none;}
            .btn-ativo { width: auto; margin: 0;}
            .chart-header { display: none; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="astromoney_home.html" class="logo">ASTRO<span>MONEY</span></a>
        
        <!-- NOVO BOTÃO HAMBÚRGUER -->
        <button class="menu-mobile-btn" onclick="alternarMenuMobile()">☰</button>
        
        <div class="nav-links">
            <a href="astromoney_home.html">Início</a>
            <a href="grafico.html">Gráfico</a>
            <a href="noticias.html">Notícias</a>
            <a href="forum.html">Fórum</a>
            <a href="login.html" class="btn-login">Entrar / Registrar</a>
        </div>
    </nav>

    <div class="workspace" id="area-de-trabalho-completa">
        
        <!-- COLUNA 1: MERCADOS -->
        <aside class="sidebar-left" id="painel-mercados">
            <div class="categoria">
                <h3>Commodities</h3>
                <button class="btn-ativo ativo-selecionado" onclick="mudarGrafico('TVC:GOLD', this, 'Ouro (GOLD)')"><span>GOLD</span></button>
                <button class="btn-ativo" onclick="mudarGrafico('TVC:SILVER', this, 'Prata (SILVER)')"><span>SILVER</span></button>
                <button class="btn-ativo" onclick="mudarGrafico('TVC:USOIL', this, 'Petróleo (WTI)')"><span>WTI</span></button>
                <button class="btn-ativo" onclick="mudarGrafico('TVC:UKOIL', this, 'Petróleo (BRENT)')"><span>BRENT</span></button>
                <button class="btn-ativo" onclick="mudarGrafico('TVC:NATGAS', this, 'Gás Natural (NGAS)')"><span>NGAS</span></button>
            </div>
            
            <div class="categoria">
                <h3>Criptomoedas</h3>
                <button class="btn-ativo" onclick="mudarGrafico('BINANCE:BTCUSD', this, 'Bitcoin (BTC)')"><span>BTCUSD</span></button>
                <button class="btn-ativo" onclick="mudarGrafico('BINANCE:SOLUSD', this, 'Solana (SOL)')"><span>SOLUSD</span></button>
                <button class="btn-ativo" onclick="mudarGrafico('BINANCE:ETHUSD', this, 'Ethereum (ETH)')"><span>ETHUSD</span></button>
            </div>

            <div class="categoria">
                <h3>Índices Capital</h3>
                <button class="btn-ativo" onclick="mudarGrafico('TVC:NI225', this, 'Nikkei 225 (JP225)')"><span>JP225</span></button>
                <button class="btn-ativo" onclick="mudarGrafico('NASDAQ:NDX', this, 'Nasdaq 100 (US100)')"><span>US100</span></button>
                <button class="btn-ativo" onclick="mudarGrafico('SP:SPX', this, 'S&P 500 (SP500)')"><span>SP500</span></button>
                <button class="btn-ativo" onclick="mudarGrafico('TVC:HSI', this, 'Hang Seng (HK50)')"><span>HK50</span></button>
                <button class="btn-ativo" onclick="mudarGrafico('TVC:CHINA50', this, 'China A50 (CHN50)')"><span>CHN50</span></button>
            </div>
        </aside>

        <!-- COLUNA 2: TERMINAL TRADINGVIEW -->
        <main class="chart-area" id="area-do-grafico">
            
            <div class="chart-header">
                <button class="btn-acao" onclick="ocultarPainel('painel-mercados')" title="Mostrar/Ocultar Mercados">☰</button>
                
                <div class="right-controls">
                    <button class="btn-acao" onclick="ocultarPainel('painel-direito')" title="Mostrar/Ocultar Painel IA">☰</button>
                    <button class="btn-acao" onclick="ativarTelaCheia()" title="Tela Cheia">⛶</button>
                </div>
            </div>

            <div class="chart-container" id="container_do_grafico"></div>
        </main>

        <!-- COLUNA 3: PAINEL DIREITO -->
        <aside class="sidebar-right" id="painel-direito">
            <div class="tab-selector">
                <button class="tab-btn active" onclick="trocarAba('ia', this)">✨ IA Assistant</button>
                <button class="tab-btn" onclick="trocarAba('news', this)">📰 Notícias</button>
            </div>
            
            <div id="painel-ia" class="panel active-panel">
                <div class="ai-chat-history" id="chat-history">
                    <div class="balao balao-ia">Olá! Em que posso ajudar hoje?</div>
                </div>
                <div class="ai-suggestions">
                    <button class="btn-sugestao" onclick="usarSugestao('Identifique os níveis de resistência.')">Identifique níveis de resistência.</button>
                    <button class="btn-sugestao" onclick="usarSugestao('Resuma o cenário macroeconômico de hoje.')">Resuma o cenário de hoje.</button>
                </div>
                <div class="ai-input-area">
                    <input type="text" id="campo-ia" class="ai-input" placeholder="Pergunte à IA..." onkeypress="verificarEnter(event)">
                    <button class="btn-enviar" onclick="enviarMensagem()">➤</button>
                </div>
            </div>

            <div id="painel-news" class="panel">
                <div class="news-header" id="titulo-noticias">Últimas sobre Ouro (GOLD)</div>
                <div class="news-list" id="lista-noticias">
                    <div class="news-item">
                        <strong>Atualização de Mercado</strong>
                        Análise de curto prazo indica alta volatilidade para Ouro (GOLD) nas próximas horas.
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- =========================================
         4. LÓGICA JAVASCRIPT
         ========================================= -->
<script src="app.js"></script>

    <script>
        function ocultarPainel(idDoPainel) {
            let painel = document.getElementById(idDoPainel);
            painel.classList.toggle('escondido');
        }

        function desenharGrafico(simbolo) {
            new TradingView.widget({
                "autosize": true,
                "symbol": simbolo,  
                "interval": "60",
                "timezone": "America/Sao_Paulo",
                "theme": "dark",
                "style": "1",
                "locale": "br",
                "enable_publishing": false,
                "backgroundColor": "#070a13",
                "gridColor": "#1e293b",
                "hide_top_toolbar": false,       
                "hide_side_toolbar": false,      
                "allow_symbol_change": true,
                "details": true,
                "container_id": "container_do_grafico"
            });
        }

        function mudarGrafico(novoSimbolo, botaoClicado, nomeAtivo) {
            desenharGrafico(novoSimbolo); 
            
            let botoes = document.querySelectorAll('.btn-ativo');
            botoes.forEach(function(botao) { botao.classList.remove('ativo-selecionado'); });
            botaoClicado.classList.add('ativo-selecionado');

            document.getElementById('titulo-noticias').innerText = "Últimas sobre " + nomeAtivo;
            document.getElementById('lista-noticias').innerHTML = `
                <div class="news-item">
                    <strong>Alerta de Volatilidade</strong>
                    Análise de curto prazo indica alta volatilidade para ${nomeAtivo} nas próximas sessões.
                </div>
                <div class="news-item">
                    <strong>Sentimento de Mercado</strong>
                    Investidores aguardam novos dados macroeconômicos que podem impactar a trajetória de ${nomeAtivo}.
                </div>
            `;
        }



        function trocarAba(abaDestino, botaoClicado) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active-panel'));
            botaoClicado.classList.add('active');

            if(abaDestino === 'ia') {
                document.getElementById('painel-ia').classList.add('active-panel');
            } else if(abaDestino === 'news') {
                document.getElementById('painel-news').classList.add('active-panel');
            }
        }

        const campoInput = document.getElementById('campo-ia');
        const historico = document.getElementById('chat-history');

        function usarSugestao(texto) { campoInput.value = texto; enviarMensagem(); }
        function verificarEnter(evento) { if (evento.key === "Enter") enviarMensagem(); }

        function enviarMensagem() {
            const mensagemUser = campoInput.value.trim();
            if (mensagemUser === "") return;

            historico.innerHTML += `<div class="balao balao-user">${mensagemUser}</div>`;
            campoInput.value = ""; 
            historico.scrollTop = historico.scrollHeight;

            setTimeout(() => {
                let respostaSimulada = "ASTRO AI Processando: A avaliar dados do ativo e indicadores para '" + mensagemUser + "'...";
                historico.innerHTML += `<div class="balao balao-ia">${respostaSimulada}</div>`;
                historico.scrollTop = historico.scrollHeight;
            }, 1000);
        }

        window.onload = function() { desenharGrafico('TVC:GOLD'); };
    </script>
</body>
</html>
