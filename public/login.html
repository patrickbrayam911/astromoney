<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTROMONEY - Entrar / Registrar</title>
    
    <!-- LIGAÇÃO AO FICHEIRO CSS GLOBAL -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* =========================================
           ESTILOS EXCLUSIVOS DESTA PÁGINA (LOGIN)
           ========================================= */
        body {
            display: flex; flex-direction: column; min-height: 100vh;
        }

        .auth-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; padding: 2rem; }
        .auth-box { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 3rem 2.5rem; width: 100%; max-width: 420px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }

        .auth-tabs { display: flex; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); }
        .tab-btn { flex: 1; background: none; border: none; color: var(--text-muted); padding: 1rem; font-size: 1.1rem; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { color: var(--neon-blue); border-bottom: 3px solid var(--primary-blue); font-weight: bold; }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted); font-weight: 500;}
        
        .form-group input, .form-group select { 
            width: 100%; padding: 0.9rem; border-radius: 8px; 
            background-color: var(--bg-color); border: 1px solid var(--border-color); 
            color: var(--text-main); outline: none; transition: 0.3s; font-size: 1rem; 
            appearance: none; 
        }
        
        .form-group input:focus, .form-group select:focus { 
            border-color: var(--primary-blue); box-shadow: 0 0 8px rgba(59, 130, 246, 0.3); 
        }

        .form-group select option {
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        .btn-submit { width: 100%; padding: 1.1rem; background-color: var(--primary-blue); color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s; margin-top: 1rem; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3); }
        .btn-submit:hover { background-color: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 15px rgba(59, 130, 246, 0.5); }

        .form-section { display: none; }
        .form-section.active { display: block; }
        .msg { margin-top: 1.5rem; text-align: center; font-size: 0.9rem; min-height: 20px; font-weight: 500;}
        .msg-erro { color: #f87171; } 
        .msg-sucesso { color: #34d399; } 

        @media (max-width: 768px) { .auth-box { padding: 2rem 1.5rem; } }
    </style>
</head>
<body>
    <nav>
        <a href="astromoney_home.html" class="logo">ASTRO<span>MONEY</span></a>
        <button class="menu-mobile-btn" onclick="alternarMenuMobile()">☰</button>
        <div class="nav-links">
            <a href="astromoney_home.html">Início</a>
            <a href="login.html" class="btn-login active">Entrar / Registrar</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="mudarAba('login')">Entrar</button>
                <button class="tab-btn" onclick="mudarAba('registrar')">Registrar</button>
            </div>
            
            <!-- FORMULÁRIO DE LOGIN -->
            <div id="form-login" class="form-section active">
                <div class="form-group"><label>E-mail</label><input type="email" id="login-email" placeholder="seu@email.com"></div>
                <div class="form-group"><label>Senha</label><input type="password" id="login-senha" placeholder="••••••••"></div>
                <button class="btn-submit" onclick="fazerLogin()">Acessar Plataforma</button>
                <div id="msg-login" class="msg"></div>
            </div>
            
            <!-- FORMULÁRIO DE REGISTRO AMPLIADO COM DUPLA CONFIRMAÇÃO -->
            <div id="form-registrar" class="form-section">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="reg-nome" placeholder="Nome por completo">
                </div>
                <div class="form-group">
                    <label>Telefone</label>
                    <input type="tel" id="reg-telefone" placeholder="(00) 00000-0000">
                </div>
                
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="reg-email" placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label>Confirmar E-mail</label>
                    <input type="email" id="reg-email-confirma" placeholder="Repita o seu e-mail">
                </div>

                <div class="form-group">
                    <label>Nível de Experiência</label>
                    <select id="reg-nivel">
                        <option value="" disabled selected>Selecione o seu nível...</option>
                        <option value="novato">Novato (Estou a dar os primeiros passos)</option>
                        <option value="regular">Regular (Já entendo o básico do mercado)</option>
                        <option value="profissional">Profissional (Opero com frequência)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Criar Senha</label>
                    <input type="password" id="reg-senha" placeholder="Mínimo 8 caracteres">
                </div>
                <!-- NOVO CAMPO: Trava de segurança para a Senha -->
                <div class="form-group">
                    <label>Confirmar Senha</label>
                    <input type="password" id="reg-senha-confirma" placeholder="Repita a sua senha">
                </div>

                <button class="btn-submit" onclick="registrarUsuario()">Criar Conta</button>
                <div id="msg-registro" class="msg"></div>
            </div>
        </div>
    </div>

    <!-- LIGAÇÃO AO CÉREBRO GLOBAL JAVASCRIPT -->
    <script src="app.js"></script>

    <!-- LÓGICA DE AUTENTICAÇÃO -->
    <script>
        function mudarAba(abaDestino) {
            const formLogin = document.getElementById('form-login');
            const formRegistrar = document.getElementById('form-registrar');
            const botoes = document.querySelectorAll('.tab-btn');

            formLogin.classList.remove('active');
            formRegistrar.classList.remove('active');

            botoes[0].classList.remove('active');
            botoes[1].classList.remove('active');

            if (abaDestino === 'login') {
                formLogin.classList.add('active');
                botoes[0].classList.add('active');
            } else {
                formRegistrar.classList.add('active');
                botoes[1].classList.add('active');
            }

            document.getElementById('msg-login').textContent = '';
            document.getElementById('msg-registro').textContent = '';
        }

        async function registrarUsuario() {
            const nome = document.getElementById('reg-nome').value.trim();
            const telefone = document.getElementById('reg-telefone').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const emailConfirma = document.getElementById('reg-email-confirma').value.trim();
            const nivel = document.getElementById('reg-nivel').value;
            const senha = document.getElementById('reg-senha').value;
            const senhaConfirma = document.getElementById('reg-senha-confirma').value;
            const msgBox = document.getElementById('msg-registro');

            if (!nome || !email || !emailConfirma || !nivel || !senha || !senhaConfirma) {
                msgBox.textContent = 'Preencha todos os campos obrigatórios.';
                msgBox.className = 'msg msg-erro';
                return;
            }

            if (email !== emailConfirma) {
                msgBox.textContent = 'Os e-mails não coincidem.';
                msgBox.className = 'msg msg-erro';
                return;
            }

            if (senha !== senhaConfirma) {
                msgBox.textContent = 'As senhas não coincidem.';
                msgBox.className = 'msg msg-erro';
                return;
            }

            if (senha.length < 8) {
                msgBox.textContent = 'A senha deve possuir pelo menos 8 caracteres.';
                msgBox.className = 'msg msg-erro';
                return;
            }

            try {
                const resposta = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        nome,
                        telefone,
                        email,
                        nivel,
                        senha
                    })
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    msgBox.textContent = dados.erro || 'Não foi possível criar a conta.';
                    msgBox.className = 'msg msg-erro';
                    return;
                }

                msgBox.textContent = 'Conta criada com sucesso! Agora pode entrar.';
                msgBox.className = 'msg msg-sucesso';

                document.getElementById('reg-nome').value = '';
                document.getElementById('reg-telefone').value = '';
                document.getElementById('reg-email').value = '';
                document.getElementById('reg-email-confirma').value = '';
                document.getElementById('reg-nivel').value = '';
                document.getElementById('reg-senha').value = '';
                document.getElementById('reg-senha-confirma').value = '';

                setTimeout(() => {
                    mudarAba('login');
                    document.getElementById('login-email').value = email;
                    document.getElementById('login-email').focus();
                }, 700);

            } catch (erro) {
                console.error(erro);
                msgBox.textContent = 'Não foi possível conectar ao servidor.';
                msgBox.className = 'msg msg-erro';
            }
        }

        async function fazerLogin() {
            const email = document.getElementById('login-email').value.trim();
            const senha = document.getElementById('login-senha').value;
            const msgBox = document.getElementById('msg-login');

            if (!email || !senha) {
                msgBox.textContent = 'Informe e-mail e senha.';
                msgBox.className = 'msg msg-erro';
                return;
            }

            try {
                const resposta = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email,
                        senha
                    })
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    msgBox.textContent = dados.erro || 'Não foi possível entrar.';
                    msgBox.className = 'msg msg-erro';
                    return;
                }

                msgBox.textContent = `Bem-vindo, ${dados.usuario.nome}!`;
                msgBox.className = 'msg msg-sucesso';

                setTimeout(() => {
                    window.location.href = 'grafico.html';
                }, 700);

            } catch (erro) {
                console.error(erro);
                msgBox.textContent = 'Não foi possível conectar ao servidor.';
                msgBox.className = 'msg msg-erro';
            }
        }

        document.getElementById('login-senha').addEventListener('keydown', (evento) => {
            if (evento.key === 'Enter') {
                fazerLogin();
            }
        });

        document.getElementById('reg-senha-confirma').addEventListener('keydown', (evento) => {
            if (evento.key === 'Enter') {
                registrarUsuario();
            }
        });
    </script>
</body>
</html>
