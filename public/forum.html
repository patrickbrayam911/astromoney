<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTROMONEY - Fórum da Comunidade</title>
    
    <!-- LIGAÇÃO AO FICHEIRO CSS GLOBAL -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* =========================================
           ESTILOS EXCLUSIVOS DESTA PÁGINA (FÓRUM)
           ========================================= */
        :root {
            --comment-bg: #141b2d; 
        }
        
        body { 
            display: flex; flex-direction: column; min-height: 100vh; 
        }

        /* FÓRUM ESTRUTURA */
        .forum-container { max-width: 900px; margin: 3rem auto; padding: 0 2rem; flex-grow: 1; width: 100%; }
        .forum-header { text-align: center; margin-bottom: 3rem; }
        .forum-header h1 { font-size: 2.5rem; color: var(--text-main); margin-bottom: 0.5rem; }
        .forum-header p { color: var(--text-muted); font-size: 1.1rem; }

        .create-post-box { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 2rem; margin-bottom: 3rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .create-post-box h2 { margin-bottom: 1.5rem; color: var(--neon-blue); font-size: 1.2rem; }
        
        .input-group { margin-bottom: 1rem; }
        .input-group input, .input-group textarea { width: 100%; background-color: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); padding: 1rem; border-radius: 8px; outline: none; transition: border-color 0.3s; font-size: 1rem; }
        .input-group input:focus, .input-group textarea:focus { border-color: var(--primary-blue); box-shadow: 0 0 8px rgba(59, 130, 246, 0.3); }
        .input-group textarea { resize: vertical; min-height: 100px; }

        /* NOVO: Estilos do Upload de Imagem */
        .custom-file-upload { display: inline-block; padding: 0.6rem 1.2rem; cursor: pointer; background-color: rgba(59, 130, 246, 0.1); border: 1px dashed var(--primary-blue); color: var(--neon-blue); border-radius: 6px; font-size: 0.9rem; transition: 0.3s; font-weight: bold; }
        .custom-file-upload:hover { background-color: rgba(59, 130, 246, 0.3); box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
        #file-name { color: var(--text-muted); font-size: 0.85rem; margin-left: 10px; font-style: italic; }

        .btn-action { background-color: var(--primary-blue); color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 1rem; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3); margin-top: 1rem; }
        .btn-action:hover { background-color: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 15px rgba(59, 130, 246, 0.5); }
        .btn-cancel { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 0.8rem 1.5rem; border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 1rem; }
        .btn-cancel:hover { border-color: #ef4444; color: #ef4444; }

        .feed-container { display: flex; flex-direction: column; gap: 2rem; }
        .post-card { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 2rem; transition: transform 0.3s; }
        .post-card:hover { border-color: rgba(59, 130, 246, 0.5); }
        
        .post-header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; width: 100%; }
        .post-info { display: flex; flex-direction: column; gap: 4px; }
        .post-actions { display: flex; gap: 8px; }
        
        .post-author { color: var(--neon-blue); font-weight: bold; font-size: 0.9rem;}
        .post-date { color: var(--text-muted); font-size: 0.8rem; }
        .post-title { font-size: 1.5rem; color: var(--text-main); margin-bottom: 1rem; }
        .post-content { color: var(--text-muted); line-height: 1.8; margin-bottom: 1.5rem; white-space: pre-wrap; }
        
        /* NOVO: Estilo da Imagem da Publicação */
        .post-image-display { max-width: 100%; height: auto; border-radius: 8px; margin-bottom: 1.5rem; border: 1px solid var(--border-color); display: block; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }

        .edit-post-title { width: 100%; background-color: var(--bg-color); border: 1px solid var(--primary-blue); color: var(--text-main); padding: 0.8rem; border-radius: 8px; outline: none; margin-bottom: 10px; font-size: 1.3rem; font-weight: bold; box-shadow: 0 0 8px rgba(59, 130, 246, 0.2); }
        .edit-post-content { width: 100%; background-color: var(--bg-color); border: 1px solid var(--primary-blue); color: var(--text-main); padding: 0.8rem; border-radius: 8px; outline: none; margin-bottom: 15px; min-height: 120px; resize: vertical; box-shadow: 0 0 8px rgba(59, 130, 246, 0.2); }
        .edit-post-controls { display: flex; gap: 10px; margin-bottom: 1.5rem; }

        .comments-section { border-top: 1px solid var(--border-color); padding-top: 1.5rem; margin-top: 1.5rem; }
        .comment-list { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }
        
        .comment-item { background-color: var(--comment-bg); padding: 1rem; border-radius: 8px; border-left: 3px solid var(--primary-blue); font-size: 0.9rem; position: relative; }
        .comment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .comment-author { font-weight: bold; color: #93c5fd; font-size: 0.85rem;}
        
        .comment-actions { display: flex; gap: 8px; }
        .btn-small { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        .btn-small:hover { color: white; border-color: var(--neon-blue); }
        .btn-small.delete:hover { border-color: #ef4444; color: #ef4444; }
        
        .emoji-bar { display: flex; gap: 10px; margin-bottom: 8px; padding-left: 5px; }
        .emoji-btn { cursor: pointer; font-size: 1.2rem; transition: transform 0.2s; user-select: none; }
        .emoji-btn:hover { transform: scale(1.3); }

        .add-comment-box { display: flex; gap: 1rem; align-items: flex-start; }
        .comment-input-wrapper { flex-grow: 1; display: flex; flex-direction: column; }
        .add-comment-box input, .edit-input { width: 100%; background-color: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.8rem; border-radius: 20px; outline: none; transition: 0.3s; }
        .add-comment-box input:focus, .edit-input:focus { border-color: var(--primary-blue); }
        
        .edit-input { border-radius: 8px; margin-bottom: 8px; }

        @media (max-width: 768px) { 
            .add-comment-box { flex-direction: column; } 
            .comment-input-wrapper { width: 100%; }
            .btn-action, .btn-cancel { width: 100%; text-align: center; }
            .edit-post-controls { flex-direction: column; }
            .post-header-top { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="grafico.html" class="logo">ASTRO<span>MONEY</span></a>
        <button class="menu-mobile-btn" onclick="alternarMenuMobile()">☰</button>
        <div class="nav-links">
            <a href="grafico.html">Gráfico</a>
            <a href="noticias.html">Notícias</a>
            <a href="forum.html" class="active">Fórum</a>
            <a href="perfil.html">Perfil</a>
            <a href="#" onclick="fazerLogout()" class="btn-login">Sair</a>
        </div>
    </nav>

    <main class="forum-container">
        <div class="forum-header">
            <h1>Comunidade ASTROMONEY</h1>
            <p>Partilhe as suas análises, tire dúvidas e converse com outros traders.</p>
        </div>

        <div class="create-post-box">
            <h2>Criar nova publicação</h2>
            <div class="input-group"><input type="text" id="post-title" placeholder="Título da sua publicação (Ex: Análise do Ouro hoje)"></div>
            <div class="input-group"><textarea id="post-content" placeholder="Escreva o conteúdo da sua análise ou dúvida aqui..."></textarea></div>
            
            <!-- NOVO: Interface de Upload de Imagem -->
            <div class="input-group" style="display: flex; align-items: center; flex-wrap: wrap; margin-bottom: 0;">
                <label class="custom-file-upload" style="opacity: 0.55; cursor: not-allowed;">
                    📷 Upload de imagem — próxima etapa
                </label>
                <span id="file-name">O backend atual ainda não armazena imagens.</span>
            </div>

            <button class="btn-action" onclick="criarPost()">Publicar no Fórum</button>
        </div>

        <div class="feed-container" id="feed-de-posts"></div>
    </main>

    <!-- LIGAÇÃO AO CÉREBRO GLOBAL JAVASCRIPT -->
    <script src="app.js"></script>
    <script>
        // ==========================================
        // FÓRUM ASTROMONEY - BACKEND + SQLITE
        // ==========================================

        let bancoDePosts = [];
        const emojisRapidos = ['🚀', '📈', '📉', '💰', '🔥', '👀'];

        // ==========================================
        // INICIALIZAÇÃO
        // ==========================================

        document.addEventListener('DOMContentLoaded', async () => {
            const usuario = await protegerPagina();

            if (!usuario) {
                return;
            }

            await carregarPosts();
        });


        // ==========================================
        // UTILITÁRIOS
        // ==========================================

        function formatarData(dataBanco) {
            if (!dataBanco) {
                return '';
            }

            // SQLite costuma devolver "YYYY-MM-DD HH:MM:SS".
            // Acrescentamos "Z" apenas se ainda não houver timezone.
            const valor =
                dataBanco.includes('T')
                    ? dataBanco
                    : dataBanco.replace(' ', 'T') + 'Z';

            const data = new Date(valor);

            if (Number.isNaN(data.getTime())) {
                return dataBanco;
            }

            return data.toLocaleString('pt-BR');
        }


        async function lerRespostaJSON(resposta) {
            try {
                return await resposta.json();
            } catch {
                return {};
            }
        }


        function criarBotao(texto, classes, onClick) {
            const botao = document.createElement('button');

            botao.type = 'button';
            botao.textContent = texto;
            botao.className = classes;
            botao.addEventListener('click', onClick);

            return botao;
        }


        // ==========================================
        // GET /api/posts
        // ==========================================

        async function carregarPosts() {
            const feed =
                document.getElementById('feed-de-posts');

            feed.innerHTML =
                '<p style="text-align:center; color:var(--text-muted);">A carregar publicações...</p>';

            try {
                const resposta =
                    await fetch('/api/posts');

                const dados =
                    await lerRespostaJSON(resposta);

                if (resposta.status === 401) {
                    window.location.href = 'login.html';
                    return;
                }

                if (!resposta.ok) {
                    throw new Error(
                        dados.erro ||
                        'Não foi possível carregar o fórum.'
                    );
                }

                bancoDePosts =
                    Array.isArray(dados.posts)
                        ? dados.posts
                        : [];

                renderizarPosts();

            } catch (erro) {
                console.error(
                    'Erro ao carregar posts:',
                    erro
                );

                feed.innerHTML = '';

                const mensagem =
                    document.createElement('p');

                mensagem.style.textAlign = 'center';
                mensagem.style.color = '#f87171';
                mensagem.textContent =
                    erro.message ||
                    'Não foi possível carregar as publicações.';

                feed.appendChild(mensagem);
            }
        }


        // ==========================================
        // RENDERIZAÇÃO SEGURA
        // ==========================================

        function renderizarPosts() {
            const feed =
                document.getElementById('feed-de-posts');

            feed.innerHTML = '';

            if (bancoDePosts.length === 0) {
                const vazio =
                    document.createElement('p');

                vazio.style.textAlign = 'center';
                vazio.style.color =
                    'var(--text-muted)';

                vazio.textContent =
                    'Ainda não há publicações. Seja o primeiro a postar!';

                feed.appendChild(vazio);
                return;
            }

            bancoDePosts.forEach(post => {
                feed.appendChild(
                    criarCartaoPost(post)
                );
            });
        }


        function criarCartaoPost(post) {
            const card =
                document.createElement('article');

            card.className = 'post-card';
            card.id = `post-card-${post.id}`;

            // Cabeçalho
            const header =
                document.createElement('div');

            header.className =
                'post-header-top';

            const info =
                document.createElement('div');

            info.className = 'post-info';

            const autor =
                document.createElement('span');

            autor.className = 'post-author';
            autor.textContent =
                `Autor: ${post.autor || 'Membro da Comunidade'}`;

            const data =
                document.createElement('span');

            data.className = 'post-date';
            data.textContent =
                formatarData(post.data);

            info.appendChild(autor);
            info.appendChild(data);
            header.appendChild(info);

            if (post.meuPost) {
                const acoes =
                    document.createElement('div');

                acoes.className =
                    'post-actions';

                acoes.appendChild(
                    criarBotao(
                        'Editar Publicação',
                        'btn-small',
                        () => iniciarEdicaoPost(post.id)
                    )
                );

                acoes.appendChild(
                    criarBotao(
                        'Apagar',
                        'btn-small delete',
                        () => apagarPost(post.id)
                    )
                );

                header.appendChild(acoes);
            }

            card.appendChild(header);

            // Corpo
            const corpo =
                document.createElement('div');

            corpo.id =
                `post-body-${post.id}`;

            const titulo =
                document.createElement('h3');

            titulo.className = 'post-title';
            titulo.textContent =
                post.titulo || '';

            const conteudo =
                document.createElement('p');

            conteudo.className =
                'post-content';

            conteudo.textContent =
                post.conteudo || '';

            corpo.appendChild(titulo);
            corpo.appendChild(conteudo);
            card.appendChild(corpo);

            // Comentários
            card.appendChild(
                criarSecaoComentarios(post)
            );

            return card;
        }


        function criarSecaoComentarios(post) {
            const secao =
                document.createElement('div');

            secao.className =
                'comments-section';

            const lista =
                document.createElement('div');

            lista.className =
                'comment-list';

            const comentarios =
                Array.isArray(post.comentarios)
                    ? post.comentarios
                    : [];

            comentarios.forEach(comentario => {
                lista.appendChild(
                    criarComentario(
                        post.id,
                        comentario
                    )
                );
            });

            secao.appendChild(lista);

            const wrapper =
                document.createElement('div');

            wrapper.className =
                'comment-input-wrapper';

            // Emojis
            const emojiBar =
                document.createElement('div');

            emojiBar.className =
                'emoji-bar';

            emojisRapidos.forEach(emoji => {
                const span =
                    document.createElement('span');

                span.className =
                    'emoji-btn';

                span.textContent = emoji;

                span.addEventListener(
                    'click',
                    () => inserirEmoji(
                        post.id,
                        emoji
                    )
                );

                emojiBar.appendChild(span);
            });

            wrapper.appendChild(emojiBar);

            // Caixa
            const caixa =
                document.createElement('div');

            caixa.className =
                'add-comment-box';

            const input =
                document.createElement('input');

            input.type = 'text';
            input.id =
                `input-comentario-${post.id}`;

            input.placeholder =
                'Escreva uma resposta (apoia emojis!)...';

            input.maxLength = 2000;

            input.addEventListener(
                'keydown',
                evento => {
                    if (evento.key === 'Enter') {
                        evento.preventDefault();
                        enviarComentario(post.id);
                    }
                }
            );

            const botao =
                criarBotao(
                    'Responder',
                    'btn-action',
                    () => enviarComentario(post.id)
                );

            botao.style.marginTop = '0';

            caixa.appendChild(input);
            caixa.appendChild(botao);

            wrapper.appendChild(caixa);
            secao.appendChild(wrapper);

            return secao;
        }


        function criarComentario(
            postId,
            comentario
        ) {
            const item =
                document.createElement('div');

            item.className =
                'comment-item';

            item.id =
                `comment-${comentario.id}`;

            const header =
                document.createElement('div');

            header.className =
                'comment-header';

            const autor =
                document.createElement('span');

            autor.className =
                'comment-author';

            autor.textContent =
                comentario.autor ||
                'Membro da Comunidade';

            header.appendChild(autor);

            if (comentario.meuComentario) {
                const acoes =
                    document.createElement('div');

                acoes.className =
                    'comment-actions';

                acoes.appendChild(
                    criarBotao(
                        'Editar',
                        'btn-small',
                        () =>
                            iniciarEdicaoComentario(
                                postId,
                                comentario.id
                            )
                    )
                );

                acoes.appendChild(
                    criarBotao(
                        'Apagar',
                        'btn-small delete',
                        () =>
                            apagarComentario(
                                comentario.id
                            )
                    )
                );

                header.appendChild(acoes);
            }

            const texto =
                document.createElement('div');

            texto.className =
                'comment-text';

            texto.id =
                `text-${comentario.id}`;

            texto.textContent =
                comentario.texto || '';

            item.appendChild(header);
            item.appendChild(texto);

            return item;
        }


        // ==========================================
        // POST /api/posts
        // ==========================================

        async function criarPost() {
            const campoTitulo =
                document.getElementById(
                    'post-title'
                );

            const campoConteudo =
                document.getElementById(
                    'post-content'
                );

            const titulo =
                campoTitulo.value.trim();

            const conteudo =
                campoConteudo.value.trim();

            if (!titulo || !conteudo) {
                alert(
                    'Preencha o título e o conteúdo da sua publicação.'
                );

                return;
            }

            if (titulo.length > 150) {
                alert(
                    'O título pode ter no máximo 150 caracteres.'
                );

                return;
            }

            try {
                const resposta =
                    await fetch(
                        '/api/posts',
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body:
                                JSON.stringify({
                                    titulo,
                                    conteudo
                                })
                        }
                    );

                const dados =
                    await lerRespostaJSON(
                        resposta
                    );

                if (!resposta.ok) {
                    alert(
                        dados.erro ||
                        'Não foi possível publicar.'
                    );

                    return;
                }

                campoTitulo.value = '';
                campoConteudo.value = '';

                await carregarPosts();

            } catch (erro) {
                console.error(
                    'Erro ao criar post:',
                    erro
                );

                alert(
                    'Não foi possível conectar ao servidor.'
                );
            }
        }


        // ==========================================
        // EDIÇÃO DE POST
        // ==========================================

        function iniciarEdicaoPost(idDoPost) {
            const post =
                bancoDePosts.find(
                    item => item.id === idDoPost
                );

            if (!post || !post.meuPost) {
                return;
            }

            const postBody =
                document.getElementById(
                    `post-body-${idDoPost}`
                );

            postBody.innerHTML = '';

            const inputTitulo =
                document.createElement('input');

            inputTitulo.type = 'text';
            inputTitulo.id =
                `edit-post-title-${idDoPost}`;

            inputTitulo.className =
                'edit-post-title';

            inputTitulo.maxLength = 150;
            inputTitulo.value =
                post.titulo || '';

            const inputConteudo =
                document.createElement('textarea');

            inputConteudo.id =
                `edit-post-content-${idDoPost}`;

            inputConteudo.className =
                'edit-post-content';

            inputConteudo.maxLength = 10000;
            inputConteudo.value =
                post.conteudo || '';

            const controles =
                document.createElement('div');

            controles.className =
                'edit-post-controls';

            const salvar =
                criarBotao(
                    'Guardar Alterações',
                    'btn-action',
                    () =>
                        guardarEdicaoPost(
                            idDoPost
                        )
                );

            salvar.style.marginTop = '0';

            const cancelar =
                criarBotao(
                    'Cancelar',
                    'btn-cancel',
                    () => renderizarPosts()
                );

            controles.appendChild(salvar);
            controles.appendChild(cancelar);

            postBody.appendChild(
                inputTitulo
            );

            postBody.appendChild(
                inputConteudo
            );

            postBody.appendChild(
                controles
            );

            inputTitulo.focus();
        }


        async function guardarEdicaoPost(
            idDoPost
        ) {
            const titulo =
                document.getElementById(
                    `edit-post-title-${idDoPost}`
                ).value.trim();

            const conteudo =
                document.getElementById(
                    `edit-post-content-${idDoPost}`
                ).value.trim();

            if (!titulo || !conteudo) {
                alert(
                    'O título e o conteúdo não podem ficar vazios.'
                );

                return;
            }

            try {
                const resposta =
                    await fetch(
                        `/api/posts/${idDoPost}`,
                        {
                            method: 'PUT',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body:
                                JSON.stringify({
                                    titulo,
                                    conteudo
                                })
                        }
                    );

                const dados =
                    await lerRespostaJSON(
                        resposta
                    );

                if (!resposta.ok) {
                    alert(
                        dados.erro ||
                        'Não foi possível editar a publicação.'
                    );

                    return;
                }

                await carregarPosts();

            } catch (erro) {
                console.error(
                    'Erro ao editar post:',
                    erro
                );

                alert(
                    'Não foi possível conectar ao servidor.'
                );
            }
        }


        // ==========================================
        // DELETE /api/posts/:id
        // ==========================================

        async function apagarPost(idDoPost) {
            const confirmou =
                confirm(
                    'Tem a certeza que deseja apagar esta publicação? Todos os comentários serão removidos.'
                );

            if (!confirmou) {
                return;
            }

            try {
                const resposta =
                    await fetch(
                        `/api/posts/${idDoPost}`,
                        {
                            method: 'DELETE'
                        }
                    );

                const dados =
                    await lerRespostaJSON(
                        resposta
                    );

                if (!resposta.ok) {
                    alert(
                        dados.erro ||
                        'Não foi possível apagar a publicação.'
                    );

                    return;
                }

                await carregarPosts();

            } catch (erro) {
                console.error(
                    'Erro ao apagar post:',
                    erro
                );

                alert(
                    'Não foi possível conectar ao servidor.'
                );
            }
        }


        // ==========================================
        // POST /api/posts/:postId/comments
        // ==========================================

        async function enviarComentario(
            idDoPost
        ) {
            const campo =
                document.getElementById(
                    `input-comentario-${idDoPost}`
                );

            const texto =
                campo.value.trim();

            if (!texto) {
                return;
            }

            try {
                const resposta =
                    await fetch(
                        `/api/posts/${idDoPost}/comments`,
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body:
                                JSON.stringify({
                                    texto
                                })
                        }
                    );

                const dados =
                    await lerRespostaJSON(
                        resposta
                    );

                if (!resposta.ok) {
                    alert(
                        dados.erro ||
                        'Não foi possível publicar o comentário.'
                    );

                    return;
                }

                campo.value = '';
                await carregarPosts();

            } catch (erro) {
                console.error(
                    'Erro ao comentar:',
                    erro
                );

                alert(
                    'Não foi possível conectar ao servidor.'
                );
            }
        }


        function inserirEmoji(
            idDoPost,
            emoji
        ) {
            const campo =
                document.getElementById(
                    `input-comentario-${idDoPost}`
                );

            if (!campo) {
                return;
            }

            campo.value += emoji;
            campo.focus();
        }


        // ==========================================
        // EDIÇÃO DE COMENTÁRIO
        // ==========================================

        function iniciarEdicaoComentario(
            idDoPost,
            idComentario
        ) {
            const post =
                bancoDePosts.find(
                    item => item.id === idDoPost
                );

            const comentario =
                post?.comentarios?.find(
                    item =>
                        item.id === idComentario
                );

            if (
                !comentario ||
                !comentario.meuComentario
            ) {
                return;
            }

            const elementoTexto =
                document.getElementById(
                    `text-${idComentario}`
                );

            elementoTexto.innerHTML = '';

            const input =
                document.createElement('input');

            input.type = 'text';
            input.id =
                `edit-input-${idComentario}`;

            input.className =
                'edit-input';

            input.maxLength = 2000;
            input.value =
                comentario.texto || '';

            const controles =
                document.createElement('div');

            controles.style.display = 'flex';
            controles.style.gap = '8px';

            controles.appendChild(
                criarBotao(
                    'Guardar',
                    'btn-small',
                    () =>
                        guardarEdicaoComentario(
                            idComentario
                        )
                )
            );

            controles.appendChild(
                criarBotao(
                    'Cancelar',
                    'btn-small delete',
                    () => renderizarPosts()
                )
            );

            elementoTexto.appendChild(input);
            elementoTexto.appendChild(
                controles
            );

            input.focus();
        }


        async function guardarEdicaoComentario(
            idComentario
        ) {
            const input =
                document.getElementById(
                    `edit-input-${idComentario}`
                );

            const texto =
                input.value.trim();

            if (!texto) {
                alert(
                    'O comentário não pode ficar vazio.'
                );

                return;
            }

            try {
                const resposta =
                    await fetch(
                        `/api/comments/${idComentario}`,
                        {
                            method: 'PUT',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body:
                                JSON.stringify({
                                    texto
                                })
                        }
                    );

                const dados =
                    await lerRespostaJSON(
                        resposta
                    );

                if (!resposta.ok) {
                    alert(
                        dados.erro ||
                        'Não foi possível editar o comentário.'
                    );

                    return;
                }

                await carregarPosts();

            } catch (erro) {
                console.error(
                    'Erro ao editar comentário:',
                    erro
                );

                alert(
                    'Não foi possível conectar ao servidor.'
                );
            }
        }


        // ==========================================
        // DELETE /api/comments/:id
        // ==========================================

        async function apagarComentario(
            idComentario
        ) {
            const confirmou =
                confirm(
                    'Tem a certeza que deseja apagar este comentário?'
                );

            if (!confirmou) {
                return;
            }

            try {
                const resposta =
                    await fetch(
                        `/api/comments/${idComentario}`,
                        {
                            method: 'DELETE'
                        }
                    );

                const dados =
                    await lerRespostaJSON(
                        resposta
                    );

                if (!resposta.ok) {
                    alert(
                        dados.erro ||
                        'Não foi possível apagar o comentário.'
                    );

                    return;
                }

                await carregarPosts();

            } catch (erro) {
                console.error(
                    'Erro ao apagar comentário:',
                    erro
                );

                alert(
                    'Não foi possível conectar ao servidor.'
                );
            }
        }
    </script>
</body>
