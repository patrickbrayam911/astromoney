<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTROMONEY - Notícias do Mercado</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ESTILOS EXCLUSIVOS DESTA PÁGINA */
        .page-header { text-align: center; padding: 3rem 2rem 1rem; background-color: var(--bg-color); }
        .page-header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--text-main); }
        .page-header p { color: var(--text-muted); }
        .topics-container { display: flex; justify-content: center; gap: 1rem; padding: 1.5rem 5%; background-color: var(--bg-color); flex-wrap: wrap; border-bottom: 1px solid var(--border-color); }
        .topic-btn { background-color: var(--panel-bg); color: var(--text-muted); border: 1px solid var(--border-color); padding: 0.6rem 1.2rem; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.3s ease; }
        .topic-btn:hover { border-color: var(--primary-blue); color: var(--text-main); }
        .topic-btn.active { background-color: var(--primary-blue); color: white; border-color: var(--primary-blue); box-shadow: 0 0 10px rgba(59, 130, 246, 0.4); }
        .news-container { padding: 3rem 5%; max-width: 1200px; margin: 0 auto; }
        .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2rem; }
        .news-card { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; transition: transform 0.3s, box-shadow 0.3s; display: flex; flex-direction: column; }
        .news-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.4); border-color: var(--primary-blue); }
        .image-wrapper { width: 100%; height: 200px; overflow: hidden; background-color: #1e293b; }
        .news-image { width: 100%; height: 100%; background-color: var(--border-color); background-size: cover; background-position: center; transition: transform 0.5s ease; }
        .news-card:hover .news-image { transform: scale(1.1); }
        .news-content { padding: 1.5rem; flex-grow: 1; display: flex; flex-direction: column; }
        .news-source { font-size: 0.8rem; color: var(--neon-blue); font-weight: bold; text-transform: uppercase; margin-bottom: 0.5rem; }
        .news-title { font-size: 1.15rem; margin-bottom: 1rem; color: var(--text-main); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .news-date { font-size: 0.85rem; color: var(--text-muted); margin-top: auto; margin-bottom: 1rem; }
        .news-btn { display: block; text-align: center; background-color: rgba(59, 130, 246, 0.1); color: var(--primary-blue); border: 1px solid var(--primary-blue); padding: 0.6rem; border-radius: 6px; text-decoration: none; font-weight: 600; transition: all 0.3s; }
        .news-btn:hover { background-color: var(--primary-blue); color: white; box-shadow: 0 0 10px rgba(59, 130, 246, 0.4); }
        .loading { text-align: center; font-size: 1.2rem; color: var(--neon-blue); grid-column: 1 / -1; padding: 3rem; font-weight: bold; }
        @media (max-width: 768px) { .page-header h1 { font-size: 2rem; } }
    </style>
</head>
<body>
    <nav>
        <a href="grafico.html" class="logo">ASTRO<span>MONEY</span></a>
        <button class="menu-mobile-btn" onclick="alternarMenuMobile()">☰</button>
        <div class="nav-links">
            <a href="grafico.html">Gráfico</a>
            <a href="noticias.html" class="active">Notícias</a>
            <a href="forum.html">Fórum</a>
            <a href="perfil.html">Perfil</a>
            <a href="#" onclick="fazerLogout()" class="btn-login" style="background: #ef4444 !important; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4) !important;">Sair</a>
        </div>
    </nav>

    <header class="page-header">
        <h1>Radar do Mercado (Pro API)</h1>
        <p>Dados fornecidos em tempo real pelos maiores portais financeiros do mundo.</p>
    </header>

    <div class="topics-container">
        <button class="topic-btn active" onclick="carregarNoticias('ultimas', this)">Últimas Relevantes</button>
        <button class="topic-btn" onclick="carregarNoticias('money', this)">Money (Economia)</button>
        <button class="topic-btn" onclick="carregarNoticias('politica', this)">Política</button>
        <button class="topic-btn" onclick="carregarNoticias('agro', this)">Agro</button>
        <button class="topic-btn" onclick="carregarNoticias('ia', this)">Tecnologia & IA</button>
        <button class="topic-btn" onclick="carregarNoticias('infra', this)">INFRA</button>
    </div>

    <main class="news-container">
        <div class="news-grid" id="caixa-de-noticias">
            <div class="loading">A conectar aos servidores da NewsAPI...</div>
        </div>
    </main>

    <script src="app.js"></script>

    <script>
    // ==========================================
    // ASTROMONEY - RADAR DE NOTÍCIAS
    // ==========================================


    /**
     * Imagens utilizadas quando uma notícia
     * não possuir imagem própria.
     */
    const imagensFallback = {

        ultimas: [
            'https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=800&q=80',
            'https://images.unsplash.com/photo-1590283603385-18ff3827fcce?auto=format&fit=crop&w=800&q=80'
        ],

        money: [
            'https://images.unsplash.com/photo-1526304640581-d334cdbbf45e?auto=format&fit=crop&w=800&q=80',
            'https://images.unsplash.com/photo-1579621970563-ebec7560ff3e?auto=format&fit=crop&w=800&q=80'
        ],

        politica: [
            'https://images.unsplash.com/photo-1529107386315-e1a2ed48a620?auto=format&fit=crop&w=800&q=80'
        ],

        agro: [
            'https://images.unsplash.com/photo-1625246333195-78d9c38ad449?auto=format&fit=crop&w=800&q=80'
        ],

        ia: [
            'https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&w=800&q=80'
        ],

        infra: [
            'https://images.unsplash.com/photo-1541888087525-076162514de7?auto=format&fit=crop&w=800&q=80'
        ]
    };


    /**
     * Remove todos os elementos existentes
     * dentro de um container.
     */
    function limparElemento(elemento) {

        while (elemento.firstChild) {

            elemento.removeChild(
                elemento.firstChild
            );
        }
    }


    /**
     * Exibe uma mensagem dentro da área
     * destinada às notícias.
     */
    function mostrarMensagem(mensagem) {

        const caixaDeNoticias =
            document.getElementById(
                'caixa-de-noticias'
            );


        limparElemento(
            caixaDeNoticias
        );


        const elementoMensagem =
            document.createElement('div');


        elementoMensagem.className =
            'loading';


        // textContent não interpreta HTML.
        elementoMensagem.textContent =
            mensagem;


        caixaDeNoticias.appendChild(
            elementoMensagem
        );
    }


    /**
     * Formata a data recebida da API
     * para o padrão brasileiro.
     */
    function formatarDataNoticia(data) {

        const objetoData =
            new Date(data);


        if (
            Number.isNaN(
                objetoData.getTime()
            )
        ) {

            return 'Data não informada';
        }


        return objetoData.toLocaleString(
            'pt-BR',
            {
                day: '2-digit',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            }
        );
    }


    /**
     * Verifica se uma URL utiliza HTTP ou HTTPS.
     *
     * Isso impede protocolos perigosos
     * como javascript: em links externos.
     */
    function urlPermitida(valor) {

        try {

            const url =
                new URL(valor);


            return (
                url.protocol === 'http:' ||
                url.protocol === 'https:'
            );

        } catch {

            return false;
        }
    }


    /**
     * Cria visualmente um card de notícia.
     *
     * Em vez de utilizar innerHTML com dados
     * recebidos de uma API externa, os elementos
     * são criados com document.createElement().
     *
     * Isso reduz o risco de XSS.
     */
    function criarCardNoticia(
        noticia,
        categoriaId,
        index
    ) {

        // ======================================
        // CARD
        // ======================================

        const card =
            document.createElement('article');


        card.className =
            'news-card';


        // ======================================
        // IMAGEM
        // ======================================

        const imageWrapper =
            document.createElement('div');


        imageWrapper.className =
            'image-wrapper';


        const imagem =
            document.createElement('div');


        imagem.className =
            'news-image';


        const imagensCategoria =
            imagensFallback[categoriaId] ||
            imagensFallback.ultimas;


        const imagemFallback =
            imagensCategoria[
                index %
                imagensCategoria.length
            ];


        const imagemEscolhida =
            urlPermitida(noticia.urlToImage)
                ? noticia.urlToImage
                : imagemFallback;


        imagem.style.backgroundImage =
            `url("${imagemEscolhida}")`;


        imageWrapper.appendChild(
            imagem
        );


        // ======================================
        // CONTEÚDO
        // ======================================

        const conteudo =
            document.createElement('div');


        conteudo.className =
            'news-content';


        // Fonte
        const fonte =
            document.createElement('div');


        fonte.className =
            'news-source';


        fonte.textContent =
            noticia.source?.name ||
            'Portal Financeiro';


        // Título
        const titulo =
            document.createElement('h2');


        titulo.className =
            'news-title';


        titulo.textContent =
            noticia.title ||
            'Notícia sem título';


        // Data
        const data =
            document.createElement('div');


        data.className =
            'news-date';


        data.textContent =
            `📅 ${formatarDataNoticia(
                noticia.publishedAt
            )}`;


        // Link
        const link =
            document.createElement('a');


        link.className =
            'news-btn';


        link.textContent =
            'Ler Matéria Completa';


        if (
            urlPermitida(
                noticia.url
            )
        ) {

            link.href =
                noticia.url;


            link.target =
                '_blank';


            // Evita que a página externa tenha
            // acesso ao window.opener.
            link.rel =
                'noopener noreferrer';

        } else {

            link.removeAttribute(
                'href'
            );


            link.textContent =
                'Link indisponível';
        }


        // ======================================
        // MONTAGEM
        // ======================================

        conteudo.append(
            fonte,
            titulo,
            data,
            link
        );


        card.append(
            imageWrapper,
            conteudo
        );


        return card;
    }


    /**
     * Busca as notícias no NOSSO servidor.
     *
     * A chave da NewsAPI não existe mais
     * no navegador.
     */
    async function carregarNoticias(
        categoriaId,
        botaoClicado
    ) {

        // Atualiza visualmente o botão ativo.
        if (botaoClicado) {

            document
                .querySelectorAll(
                    '.topic-btn'
                )
                .forEach(botao => {

                    botao.classList.remove(
                        'active'
                    );
                });


            botaoClicado.classList.add(
                'active'
            );
        }


        mostrarMensagem(
            'A pesquisar os artigos mais recentes...'
        );


        try {

            // Agora chamamos somente nosso backend.
            const resposta =
                await fetch(
                    `/api/noticias?categoria=${encodeURIComponent(
                        categoriaId
                    )}`
                );


            // Sessão expirada.
            if (
                resposta.status === 401
            ) {

                window.location.href =
                    'login.html';

                return;
            }


            const dados =
                await resposta.json();


            if (!resposta.ok) {

                throw new Error(
                    dados.erro ||
                    'Não foi possível carregar as notícias.'
                );
            }


            const artigos =
                Array.isArray(
                    dados.artigos
                )
                    ? dados.artigos
                    : [];


            // Remove artigos inválidos ou
            // removidos pela fonte.
            let noticiasFiltradas =
                artigos.filter(
                    noticia => {

                        return (
                            noticia &&
                            noticia.title &&
                            noticia.title !==
                            '[Removed]'
                        );
                    }
                );


            if (
                noticiasFiltradas.length === 0
            ) {

                mostrarMensagem(
                    'Nenhuma notícia encontrada no momento.'
                );

                return;
            }


            const caixaDeNoticias =
                document.getElementById(
                    'caixa-de-noticias'
                );


            limparElemento(
                caixaDeNoticias
            );


            // Mostra no máximo 12 notícias.
            noticiasFiltradas
                .slice(0, 12)
                .forEach(
                    (noticia, index) => {

                        const card =
                            criarCardNoticia(
                                noticia,
                                categoriaId,
                                index
                            );


                        caixaDeNoticias.appendChild(
                            card
                        );
                    }
                );


        } catch (erro) {

            console.error(
                'Erro ao carregar notícias:',
                erro
            );


            mostrarMensagem(
                'Não foi possível carregar as notícias. Tente novamente em alguns instantes.'
            );
        }
    }


    // ==========================================
    // INICIALIZAÇÃO
    // ==========================================

    document.addEventListener(
        'DOMContentLoaded',
        async () => {

            // Primeiro verificamos se existe
            // uma sessão válida.
            const usuario =
                await protegerPagina();


            if (!usuario) {

                return;
            }


            const botaoInicial =
                document.querySelector(
                    '.topic-btn.active'
                );


            await carregarNoticias(
                'ultimas',
                botaoInicial
            );
        }
    );
</script>
</body>
</html>
