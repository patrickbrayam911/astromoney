<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTROMONEY - Notícias do Mercado</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ESTILOS EXCLUSIVOS DESTA PÁGINA */
        .page-header { text-align: center; padding: 3rem 2rem 1rem; background-color: var(--bg-color); }
        .page-header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--text-main); }
        .page-header p { color: var(--text-muted); }
        .topics-container { display: flex; justify-content: center; gap: 1rem; padding: 1.5rem 5%; background-color: var(--bg-color); flex-wrap: wrap; border-bottom: 1px solid var(--border-color); }
        .topic-btn { background-color: var(--panel-bg); color: var(--text-muted); border: 1px solid var(--border-color); padding: 0.6rem 1.2rem; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.3s ease; }
        .topic-btn:hover { border-color: var(--primary-blue); color: var(--text-main); }
        .topic-btn.active { background-color: var(--primary-blue); color: white; border-color: var(--primary-blue); box-shadow: 0 0 10px rgba(59, 130, 246, 0.4); }
        .news-container { padding: 3rem 5%; max-width: 1200px; margin: 0 auto; }
        .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2rem; }
        .news-card { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; transition: transform 0.3s, box-shadow 0.3s; display: flex; flex-direction: column; }
        .news-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.4); border-color: var(--primary-blue); }
        .image-wrapper { width: 100%; height: 200px; overflow: hidden; background-color: #1e293b; }
        .news-image { width: 100%; height: 100%; background-color: var(--border-color); background-size: cover; background-position: center; transition: transform 0.5s ease; }
        .news-card:hover .news-image { transform: scale(1.1); }
        .news-content { padding: 1.5rem; flex-grow: 1; display: flex; flex-direction: column; }
        .news-source { font-size: 0.8rem; color: var(--neon-blue); font-weight: bold; text-transform: uppercase; margin-bottom: 0.5rem; }
        .news-title { font-size: 1.15rem; margin-bottom: 1rem; color: var(--text-main); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .news-date { font-size: 0.85rem; color: var(--text-muted); margin-top: auto; margin-bottom: 1rem; }
        .news-btn { display: block; text-align: center; background-color: rgba(59, 130, 246, 0.1); color: var(--primary-blue); border: 1px solid var(--primary-blue); padding: 0.6rem; border-radius: 6px; text-decoration: none; font-weight: 600; transition: all 0.3s; }
        .news-btn:hover { background-color: var(--primary-blue); color: white; box-shadow: 0 0 10px rgba(59, 130, 246, 0.4); }
        .loading { text-align: center; font-size: 1.2rem; color: var(--neon-blue); grid-column: 1 / -1; padding: 3rem; font-weight: bold; }
        @media (max-width: 768px) { .page-header h1 { font-size: 2rem; } }
    </style>
</head>
<body>
    <nav>
        <a href="grafico.html" class="logo">ASTRO<span>MONEY</span></a>
        <button class="menu-mobile-btn" onclick="alternarMenuMobile()">☰</button>
        <div class="nav-links">
            <a href="grafico.html">Gráfico</a>
            <a href="noticias.html" class="active">Notícias</a>
            <a href="forum.html">Fórum</a>
            <a href="perfil.html">Perfil</a>
            <a href="#" onclick="fazerLogout()" class="btn-login" style="background: #ef4444 !important; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4) !important;">Sair</a>
        </div>
    </nav>

    <header class="page-header">
        <h1>Radar do Mercado (Pro API)</h1>
        <p>Dados fornecidos em tempo real pelos maiores portais financeiros do mundo.</p>
    </header>

    <div class="topics-container">
        <button class="topic-btn active" onclick="carregarNoticias('ultimas', this)">Últimas Relevantes</button>
        <button class="topic-btn" onclick="carregarNoticias('money', this)">Money (Economia)</button>
        <button class="topic-btn" onclick="carregarNoticias('politica', this)">Política</button>
        <button class="topic-btn" onclick="carregarNoticias('agro', this)">Agro</button>
        <button class="topic-btn" onclick="carregarNoticias('ia', this)">Tecnologia & IA</button>
        <button class="topic-btn" onclick="carregarNoticias('infra', this)">INFRA</button>
    </div>

    <main class="news-container">
        <div class="news-grid" id="caixa-de-noticias">
            <div class="loading">A conectar aos servidores da NewsAPI...</div>
        </div>
    </main>

    <script src="app.js"></script>

    <script>
        // ==========================================
        // 1. A SUA CHAVE DE ACESSO (API KEY)
        // Substitua 'SUA_CHAVE_AQUI' pela chave fornecida pela NewsAPI
        // ==========================================
        const MINHA_API_KEY = 'bc8c7a60991b4f05881c7ecacd2ee7bf'; 

        // 2. Os termos exatos de pesquisa para a API (Queries)
        const consultasNewsAPI = {
            'ultimas': 'mercado financeiro OR investimentos',
            'money': 'economia OR bolsa de valores',
            'politica': 'política brasil',
            'agro': 'agronegócio OR agricultura',
            'ia': 'inteligência artificial OR tecnologia',
            'infra': 'infraestrutura OR obras'
        };

        // Mantemos a galeria de reserva caso a API não tenha imagem para um artigo específico
        const imagensFallback = {
            'ultimas': ['https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=800&q=80', 'https://images.unsplash.com/photo-1590283603385-18ff3827fcce?auto=format&fit=crop&w=800&q=80'],
            'money': ['https://images.unsplash.com/photo-1526304640581-d334cdbbf45e?auto=format&fit=crop&w=800&q=80', 'https://images.unsplash.com/photo-1579621970563-ebec7560ff3e?auto=format&fit=crop&w=800&q=80'],
            'politica': ['https://images.unsplash.com/photo-1529107386315-e1a2ed48a620?auto=format&fit=crop&w=800&q=80'],
            'agro': ['https://images.unsplash.com/photo-1625246333195-78d9c38ad449?auto=format&fit=crop&w=800&q=80'],
            'ia': ['https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&w=800&q=80'],
            'infra': ['https://images.unsplash.com/photo-1541888087525-076162514de7?auto=format&fit=crop&w=800&q=80']
        };

        function carregarNoticias(categoriaId, botaoClicado) {
            if(botaoClicado) {
                document.querySelectorAll('.topic-btn').forEach(btn => btn.classList.remove('active'));
                botaoClicado.classList.add('active');
            }
            
            const caixaDeNoticias = document.getElementById('caixa-de-noticias');
            caixaDeNoticias.innerHTML = '<div class="loading">A pesquisar os artigos mais recentes...</div>';

            const termoPesquisa = encodeURIComponent(consultasNewsAPI[categoriaId]);
            
            // Construção do link para a NewsAPI
            // sortBy=publishedAt garante que as notícias são sempre as mais recentes
            const urlAPI = `https://newsapi.org/v2/everything?q=${termoPesquisa}&language=pt&sortBy=publishedAt&apiKey=${MINHA_API_KEY}`;

            fetch(urlAPI)
                .then(resposta => {
                    if (!resposta.ok) throw new Error("Erro na requisição. Verifique a sua API Key ou as restrições CORS.");
                    return resposta.json();
                })
                .then(dados => {
                    caixaDeNoticias.innerHTML = ''; 
                    
                    // A NewsAPI guarda as notícias dentro do array "articles"
                    if(dados.articles && dados.articles.length > 0) {
                        
                        let noticiasFiltradas = dados.articles.filter(n => n.title !== "[Removed]"); // Limpa notícias removidas pelos autores

                        // O seu filtro de 24 horas inteligente, aplicado como solicitou
                        if (categoriaId !== 'ultimas') {
                            const dataDeHoje = new Date(); 
                            noticiasFiltradas = noticiasFiltradas.filter(noticia => {
                                const dataDaNoticia = new Date(noticia.publishedAt);
                                const diferencaEmHoras = (dataDeHoje - dataDaNoticia) / (1000 * 60 * 60);
                                return diferencaEmHoras >= 24; 
                            });

                            if (noticiasFiltradas.length === 0) {
                                noticiasFiltradas = dados.articles.slice(0, 12);
                            }
                        }

                        // Criação dos cartões com dados diretos da API
                        noticiasFiltradas.slice(0, 12).forEach((noticia, index) => {
                            
                            // A API profissional já nos dá a imagem e a fonte organizadas!
                            let imagemEncontrada = noticia.urlToImage || imagensFallback[categoriaId][index % imagensFallback[categoriaId].length];
                            let dataFormatada = new Date(noticia.publishedAt).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute:'2-digit' });
                            let fonteOrigem = noticia.source.name || "Portal Financeiro";

                            const cartaoHTML = `
                                <div class="news-card">
                                    <div class="image-wrapper"><div class="news-image" style="background-image: url('${imagemEncontrada}');"></div></div>
                                    <div class="news-content">
                                        <div class="news-source">${fonteOrigem}</div>
                                        <h2 class="news-title">${noticia.title}</h2>
                                        <div class="news-date">📅 ${dataFormatada}</div>
                                        <a href="${noticia.url}" target="_blank" class="news-btn">Ler Matéria Completa</a>
                                    </div>
                                </div>`;
                            caixaDeNoticias.innerHTML += cartaoHTML;
                        });
                    } else { 
                        caixaDeNoticias.innerHTML = '<div class="loading">Nenhuma notícia encontrada no momento.</div>'; 
                    }
                })
                .catch(erro => { 
                    console.error("Erro detectado:", erro);
                    caixaDeNoticias.innerHTML = '<div class="loading">Erro ao conectar à API. Se estiver online no GitHub, a NewsAPI pode bloquear requisições gratuitas por CORS. Teste no seu computador local.</div>'; 
                });
        }
        
        window.onload = function() { 
            if (typeof protegerPagina === "function") { protegerPagina(); }
            carregarNoticias('ultimas', document.querySelector('.topic-btn.active')); 
        };
    </script>
</body>
</html>
